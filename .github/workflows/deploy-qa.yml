name: Deploy QA

# Deploys every push to `main` to https://auth-qa.udienz.web.id (a second, separate
# authentik stack in /srv/auth-qa). Production deploys only from a v* tag (deploy.yml),
# so a release is always tried here first.
#
# It needs the repository variable QA_DEPLOY=true (Settings > Variables), so the workflow is
# a no-op until the QA stack exists on the server, and the repository secrets listed in
# deploy.yml. The GitHub Environment `qa` is created on first run.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-qa
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to QA
    if: ${{ vars.QA_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: qa
      url: https://auth-qa.udienz.web.id
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.AUTH_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.AUTH_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy
        env:
          SSH_HOST: ${{ secrets.AUTH_SSH_HOST }}
          SSH_PORT: ${{ secrets.AUTH_SSH_PORT }}
          SSH_USER: ${{ secrets.AUTH_SSH_USER }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            'bash -s' -- qa "$GITHUB_SHA" < scripts/deploy.sh
